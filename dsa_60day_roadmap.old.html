<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSA Interview Prep - Premium Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #0f172a;
    --bg-card: #1e293b;
    --bg-hover: #334155;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --border: #334155;
    --radius: 12px;
    --font: 'Inter', sans-serif;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg-main); color: var(--text-primary); line-height: 1.5; padding: 20px; }
  .app-container { max-width: 1000px; margin: 0 auto; }
  
  .header { display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 20px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
  .header-left h1 { font-size: 28px; font-weight: 700; background: linear-gradient(to right, #60a5fa, #a78bfa); -webkit-background-clip: text; color: transparent; }
  .header-left p { color: var(--text-secondary); margin-top: 4px; font-size: 14px; }
  .header-actions { display: flex; gap: 12px; }
  
  .btn { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border); padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; font-family: inherit; display: flex; align-items: center; gap: 6px; }
  .btn:hover { background: var(--bg-hover); border-color: var(--accent); }
  .btn-primary { background: var(--accent); color: white; border: none; }
  .btn-primary:hover { background: var(--accent-hover); }
  
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; position: relative; overflow: hidden; }
  .stat-val { font-size: 28px; font-weight: 700; }
  .stat-label { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
  .diff-stats { display: flex; gap: 12px; margin-top: 12px; font-size: 12px; font-weight: 500; }
  .diff-E { color: var(--success); }
  .diff-M { color: var(--warning); }
  .diff-H { color: var(--danger); }
  
  .progress-wrap { background: var(--bg-main); height: 6px; border-radius: 10px; margin-top: 12px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
  
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tab { padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); font-size: 13px; font-weight: 500; color: var(--text-secondary); cursor: pointer; background: var(--bg-card); transition: all 0.2s; }
  .tab:hover { background: var(--bg-hover); color: var(--text-primary); }
  .tab.active { background: var(--text-primary); color: var(--bg-main); border-color: var(--text-primary); }
  
  .topic-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); transition: transform 0.2s; }
  .topic-card:hover { border-color: var(--bg-hover); }
  .topic-header { display: flex; align-items: center; padding: 16px 20px; cursor: pointer; user-select: none; }
  .topic-icon { font-size: 24px; margin-right: 16px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.05); border-radius: 10px; }
  .topic-title { flex: 1; }
  .topic-name { font-size: 16px; font-weight: 600; }
  .topic-sub { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
  .topic-progress { font-size: 14px; font-weight: 500; color: var(--accent); margin-right: 16px; }
  
  .topic-body { border-top: 1px solid var(--border); display: none; }
  .topic-body.open { display: block; animation: slideDown 0.3s ease-out; }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  
  .subpattern { padding: 20px; border-bottom: 1px solid var(--border); }
  .subpattern:last-child { border-bottom: none; }
  .sub-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .sub-name { font-size: 14px; font-weight: 600; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
  .sub-tag { font-size: 11px; padding: 2px 8px; border-radius: 12px; background: rgba(59, 130, 246, 0.1); color: var(--accent); }
  
  .q-list { display: flex; flex-direction: column; gap: 8px; }
  .q-item-container { background: rgba(255,255,255,0.02); border: 1px solid transparent; border-radius: 8px; transition: all 0.2s; }
  .q-item-container:hover { background: rgba(255,255,255,0.04); border-color: var(--border); }
  .q-item { display: flex; align-items: center; padding: 10px 14px; gap: 12px; }
  
  .q-check { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; }
  .q-check:hover { border-color: var(--success); }
  .q-check.done { background: var(--success); border-color: var(--success); }
  .q-check.done::after { content: '✓'; color: #fff; font-size: 12px; font-weight: bold; }
  
  .q-name { flex: 1; font-size: 14px; font-weight: 500; color: var(--text-primary); text-decoration: none; transition: color 0.2s; }
  .q-name:hover { color: var(--accent); }
  .q-name.done { color: var(--text-muted); text-decoration: line-through; }
  
  .q-actions { display: flex; gap: 8px; align-items: center; }
  .icon-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px; padding: 4px; border-radius: 4px; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
  .icon-btn:hover { color: var(--text-primary); background: rgba(255,255,255,0.1); }
  .icon-btn.active.star { color: var(--warning); }
  .icon-btn.active.note { color: var(--accent); }
  
  .diff-badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 12px; }
  .badge-E { background: rgba(16, 185, 129, 0.1); color: var(--success); }
  .badge-M { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
  .badge-H { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
  .badge-SD { background: rgba(167, 139, 250, 0.1); color: #a78bfa; }
  
  .notes-panel { padding: 0 14px 14px 46px; display: none; }
  .notes-panel.open { display: block; }
  .notes-textarea { width: 100%; background: var(--bg-main); border: 1px solid var(--border); border-radius: 8px; padding: 10px; color: var(--text-primary); font-family: inherit; font-size: 13px; resize: vertical; min-height: 60px; transition: border-color 0.2s; }
  .notes-textarea:focus { outline: none; border-color: var(--accent); }
  
  .add-q-form { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); }
  .input-text { flex: 1; background: var(--bg-main); border: 1px solid var(--border); color: white; padding: 8px 12px; border-radius: 6px; font-size: 13px; font-family: inherit; }
  .input-select { background: var(--bg-main); border: 1px solid var(--border); color: white; padding: 8px; border-radius: 6px; font-size: 13px; font-family: inherit; }
  .input-text:focus, .input-select:focus { outline: none; border-color: var(--accent); }
</style>
</head>
<body>

<div class="app-container">
  <div class="header">

    </div>
  </div>

  <div class="tabs" id="topicTabs"></div>
  <div id="topicView"></div>
</div>

let appState = {
  done: [],
  bookmarks: [],
  notes: {},
  customQs: {}
};

if (storedV2) {
  try { appState = Object.assign(appState, JSON.parse(storedV2)); } catch (e) {}
} else {
  // Migrate from V1 if exists
  const storedV1 = localStorage.getItem(V1_KEY);
  if (storedV1) {
    try { appState.done = JSON.parse(storedV1); } catch (e) {}
  }
}

topics.forEach((t) => {
  t.subpatterns.forEach((sp, spIdx) => {
    const key = t.id + '-' + spIdx;
    if (appState.customQs[key]) {
      const customQuestions = appState.customQs[key].map(q => Object.assign({}, q, {custom: true}));
      sp.qs = sp.qs.concat(customQuestions);
    }
  });
});

function saveState() {
  localStorage.setItem(V2_KEY, JSON.stringify(appState));
  renderStats();
}

function generateLeetCodeLink(name) {
  const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  return 'https://leetcode.com/problems/' + slug + '/';
}

function countStats() {
  let tot = 0, doneCount = 0;
  let stats = { E: {t:0, d:0}, M: {t:0, d:0}, H: {t:0, d:0}, SD: {t:0, d:0} };
  
  topics.forEach(t => t.subpatterns.forEach(s => s.qs.forEach(q => {
    tot++;
    const isDone = appState.done.includes(q.n);
    if (isDone) doneCount++;
    if (stats[q.d]) {
      stats[q.d].t++;
      if (isDone) stats[q.d].d++;
    } else {
      // Default fallback
      stats.SD.t++;
      if(isDone) stats.SD.d++;
    }
  })));
  return { tot, doneCount, stats };
}

function renderStats() {
  const res = countStats();
  document.getElementById('totalQ').textContent = res.tot;
  document.getElementById('doneQ').textContent = res.doneCount;
  
  const pct = res.tot > 0 ? (res.doneCount / res.tot) * 100 : 0;
  document.getElementById('totalPct').textContent = Math.round(pct) + '%';
  document.getElementById('progressFill').style.width = pct + '%';
  
  document.getElementById('totE').textContent = res.stats.E.t;
  document.getElementById('doneE').textContent = res.stats.E.d;
  document.getElementById('totM').textContent = res.stats.M.t;
  document.getElementById('doneM').textContent = res.stats.M.d;
  document.getElementById('totH').textContent = res.stats.H.t;
  document.getElementById('doneH').textContent = res.stats.H.d;
}

function toggleDone(qName) {
  const idx = appState.done.indexOf(qName);
  if (idx > -1) appState.done.splice(idx, 1);
  else appState.done.push(qName);
  saveState();
  renderTopicView();
}

function toggleBookmark(e, qName) {
  e.stopPropagation();
  e.preventDefault();
  const idx = appState.bookmarks.indexOf(qName);
  if (idx > -1) appState.bookmarks.splice(idx, 1);
  else appState.bookmarks.push(qName);
  saveState();
  renderTopicView();
}

function toggleNotes(e, qIdStr) {
  e.stopPropagation();
  e.preventDefault();
  const panel = document.getElementById('notes-' + qIdStr);
  const btn = document.getElementById('noteBtn-' + qIdStr);
  panel.classList.toggle('open');
  btn.classList.toggle('active');
}

function saveNote(qName, val) {
  if (!val.trim()) {
    delete appState.notes[qName];
  } else {
    appState.notes[qName] = val;
  }
  saveState();
}

function addCustomQuestion(tId, spIdx) {
  const nameInput = document.getElementById('new-q-name-' + tId + '-' + spIdx);
  const diffInput = document.getElementById('new-q-diff-' + tId + '-' + spIdx);
  const name = nameInput.value.trim();
  const diff = diffInput.value;
  
  if (!name) return alert('Please enter a question name');
  
  const key = tId + '-' + spIdx;
  if (!appState.customQs[key]) appState.customQs[key] = [];
  
  if (appState.customQs[key].find(q => q.n === name)) return alert('Question already exists here.');
  
  const newQ = { n: name, d: diff, custom: true };
  appState.customQs[key].push(newQ);
  saveState();
  
  const t = topics.find(topic => topic.id === tId);
  t.subpatterns[spIdx].qs.push(newQ);
  
  renderTopicView();
}

function exportData() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
  const downloadAnchorNode = document.createElement('a');
  downloadAnchorNode.setAttribute("href", dataStr);
  downloadAnchorNode.setAttribute("download", "dsa_tracker_backup.json");
  document.body.appendChild(downloadAnchorNode);
  downloadAnchorNode.click();
  downloadAnchorNode.remove();
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      if (imported.done && typeof imported === 'object') {
        appState = imported;
        if(!appState.customQs) appState.customQs = {};
        if(!appState.notes) appState.notes = {};
        if(!appState.bookmarks) appState.bookmarks = {};
        saveState();
        alert('Data imported successfully! Reloading...');
        location.reload();
      } else {
        alert('Invalid backup file structure.');
      }
    } catch (err) {
      alert('Error parsing JSON file.');
    }
  };
  reader.readAsText(file);
}

function renderTopicView() {
  const container = document.getElementById('topicView');
  const filtered = currentTopic === 'all' ? topics : topics.filter(t => t.id === currentTopic);
  
  container.innerHTML = filtered.map(topic => {
    let tTot = 0, tDone = 0;
    topic.subpatterns.forEach(sp => {
      tTot += sp.qs.length;
      tDone += sp.qs.filter(q => appState.done.includes(q.n)).length;
    });
    const isOpen = topic.isOpen ? 'open' : '';
    const chev = topic.isOpen ? '▲' : '▼';
    
    return `
    <div class="topic-card">
      <div class="topic-header" onclick="toggleTopic('${topic.id}')">
        <div class="topic-icon">${topic.icon}</div>
        <div class="topic-title">
          <div class="topic-name">${topic.name}</div>
          <div class="topic-sub">${tDone} / ${tTot} completed</div>
        </div>
        <div class="topic-progress">${tTot > 0 ? Math.round((tDone/tTot)*100) : 0}%</div>
        <div style="color: var(--text-muted); font-size: 12px;">${chev}</div>
      </div>
      <div class="topic-body ${isOpen}" id="body-${topic.id}">
        ${topic.subpatterns.map((sp, spIdx) => `
          <div class="subpattern">
            <div class="sub-header">
              <div class="sub-name">${sp.name} <span class="sub-tag">${sp.tag}</span></div>
              <div style="font-size:12px; color:var(--text-muted)">${sp.qs.length} questions</div>
            </div>
            <div class="q-list">
              ${sp.qs.map((q, qIdx) => {
                const isDone = appState.done.includes(q.n);
                const isBookmarked = appState.bookmarks.includes(q.n);
                const noteVal = appState.notes[q.n] || '';
                const hasNote = noteVal.length > 0;
                const link = generateLeetCodeLink(q.n);
                const safeQId = q.n.replace(/[^a-zA-Z0-9]/g, '') + '-' + qIdx;
                
                return `
                <div class="q-item-container">
                  <div class="q-item">
                    <div class="q-check ${isDone ? 'done' : ''}" onclick="toggleDone('${q.n.replace(/'/g,"\\'")}')"></div>
                    <a href="${link}" target="_blank" class="q-name ${isDone ? 'done' : ''}">${q.n} ${q.custom ? '<span class="sub-tag" style="margin-left:6px">Custom</span>' : ''}</a>
                    <span class="diff-badge badge-${q.d}">${q.d}</span>
                    <div class="q-actions">
                      <button class="icon-btn ${hasNote ? 'active note' : ''}" id="noteBtn-${safeQId}" onclick="toggleNotes(event, '${safeQId}')" title="Notes">📝</button>
                      <button class="icon-btn ${isBookmarked ? 'active star' : ''}" onclick="toggleBookmark(event, '${q.n.replace(/'/g,"\\'")}')" title="Bookmark">⭐</button>
                    </div>
                  </div>
                  <div class="notes-panel" id="notes-${safeQId}">
                    <textarea class="notes-textarea" placeholder="Add your notes here..." onblur="saveNote('${q.n.replace(/'/g,"\\'")}', this.value)">${noteVal}</textarea>
                  </div>
                </div>
                `;
              }).join('')}
              
              <div class="add-q-form">
                <input type="text" id="new-q-name-${topic.id}-${spIdx}" class="input-text" placeholder="Custom question name...">
                <select id="new-q-diff-${topic.id}-${spIdx}" class="input-select">
                  <option value="E">Easy</option>
                  <option value="M">Medium</option>
                  <option value="H">Hard</option>
                </select>
                <button class="btn btn-primary" onclick="addCustomQuestion('${topic.id}', ${spIdx})">+ Add</button>
              </div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>`;
  }).join('');
}

function toggleTopic(id) {
  const t = topics.find(topic => topic.id === id);
  if (t) {
    t.isOpen = !t.isOpen;
    renderTopicView();
  }
}

function renderTabs() {
  const tabs = document.getElementById('topicTabs');
  tabs.innerHTML = `<button class="tab ${currentTopic==='all'?'active':''}" onclick="filterTopic('all')">All Topics</button>` +
    topics.map(t => `<button class="tab ${currentTopic===t.id?'active':''}" onclick="filterTopic('${t.id}')">${t.icon} ${t.name}</button>`).join('');
}

function filterTopic(id) {
  currentTopic = id;
  renderTabs();
  renderTopicView();
}

// Init
renderTabs();
renderTopicView();
renderStats();
</script>
</body>
</html>
